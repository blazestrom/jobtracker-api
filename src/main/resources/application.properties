spring.application.name=jobtracker

# ==========================
# Database Configuration
# ==========================

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/jobtracker_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:00000}

# ==========================
# JPA / Hibernate
# ==========================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Optional (Good Practice)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
jwt.secret=${JWT_SECRET:ThisIsMySecretKeyForJWTTokenGenerationPleaseChangeInProduction123456}
jwt.expiration=${JWT_EXPIRATION:86400000}