spring.application.name=jobtracker

# ==========================
# Database Configuration
# ==========================

spring.datasource.url=jdbc:postgresql://localhost:5432/jobtracker_db
spring.datasource.username=postgres
spring.datasource.password=00000

# ==========================
# JPA / Hibernate
# ==========================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Optional (Good Practice)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
jwt.secret=ThisIsMySecretKeyForJWTTokenGenerationPleaseChangeInProduction123456
jwt.expiration=86400000